openapi: 3.1.0
info:
  title: TavernAPI
  version: "2026-11-03"
  summary: OpenAI-compatible chat completions for SillyTavern and other roleplay apps.
  description: |
    The OpenAI-compatible part of the TavernAPI gateway. Only the fields below are
    documented. Native Claude (`POST /v1/messages`) and Gemini
    (`/v1beta/models/{model}:generateContent`) endpoints also exist; see the README.
    Guides and error reference: https://tavernapi.com/troubleshooting/
  contact:
    name: TavernAPI support
    url: https://tavernapi.com/contact/
servers:
  - url: https://tavernapi.com/v1
security:
  - bearerAuth: []
paths:
  /models:
    get:
      summary: List the model IDs you can use
      security: []
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /chat/completions:
    post:
      summary: Create a chat completion (set stream to true for server-sent events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: >
            A chat completion. With stream=true the body is text/event-stream with
            OpenAI-style chunks, ending with data: [DONE].
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your API key (sk-tav-...), created in https://tavernapi.com/console
  responses:
    Error:
      description: >
        Error. The code field says what happened; see
        https://tavernapi.com/troubleshooting/ for every code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ModelList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                examples: [gemini-4-argon]
              object:
                type: string
                const: model
              owned_by:
                type: string
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          enum: [claude-opus-5-5, claude-sonnet-5-5, gemini-4-argon, gemini-3.8-flash, deepseek-v4-pro]
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        max_tokens:
          type: integer
          minimum: 1
          description: >
            Maximum reply length. Before the request, a hold of (visible input +
            max_tokens at the output price) is placed on your balance; only the
            tokens actually used are charged.
        temperature:
          type: number
        top_p:
          type: number
        stream:
          type: boolean
          default: false
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              examples: [Insufficient balance]
            type:
              type: string
              examples: [invalid_request_error]
            code:
              type: string
              examples: [insufficient_balance]
